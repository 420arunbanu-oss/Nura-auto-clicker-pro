name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Buildozer / Apktool
      run: |
        echo "Building Nura Auto Clicker APK..."
        mkdir -p build_output
        echo "Build placeholder" > build_output/Nura-AutoClicker.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nura-AutoClicker-APK
        path: build_output/
